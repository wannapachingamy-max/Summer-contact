<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact</title>
    <link href="https://fonts.googleapis.com/css2?family=Quicksand:wght@500;700&family=Sarabun:wght@400;600&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-color: #fbf8f5;
            --box-bg: #fffcf9;
            --border-color: #e5d8cd;
            --text-color: #726359;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Quicksand', 'Sarabun', sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 400px;
        }

        /* หัวข้อใหญ่ : Contact */
        .main-heading {
            text-align: center;
            font-size: 32px;
            font-weight: 700;
            margin-bottom: 30px;
            color: #726359;
            letter-spacing: 1px;
        }

        /* บอดี้ Grid 2 คอลัมน์ ตำแหน่งตามรูปต้นฉบับ */
        .contact-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 16px;
        }

        .contact-box {
            background-color: var(--box-bg);
            border: 2px solid var(--border-color);
            border-radius: 20px;
            padding: 24px 16px;
            text-align: center;
            text-decoration: none;
            color: var(--text-color);
            font-size: 18px;
            font-weight: 600;
            transition: all 0.2s ease;
            box-shadow: 0 4px 10px rgba(212, 197, 185, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .contact-box:hover {
            background-color: #f3eae1;
            transform: translateY(-2px);
        }
    </style>
</head>
<body>

    <div class="container">
        <!-- ส่วนหัว -->
        <h1 class="main-heading">Contact</h1>

        <!-- บอดี้ -->
        <div class="contact-grid">
            <a href="#" class="contact-box">Line</a>
            <a href="#" class="contact-box">X</a>
            <a href="#" class="contact-box">Facebook</a>
            <a href="#" class="contact-box">Instargram</a>
            <a href="#" class="contact-box">Tiktok</a>
            <a href="#" class="contact-box">Gmail</a>
        </div>
    </div>

</body>
</html>
