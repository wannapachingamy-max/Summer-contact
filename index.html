<!DOCTYPE html>
<html lang="th" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Contact - Pimmuki Shop</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        sans: ['"Plus Jakarta Sans"', 'sans-serif'],
                    },
                }
            }
        }
    </script>
    <style>
        body {
            background-color: #f3efe9;
            color: #5c5450;
            background-image: 
                radial-gradient(circle at 20% 20%, rgba(245, 230, 234, 0.7) 0%, transparent 40%),
                radial-gradient(circle at 80% 80%, rgba(218, 226, 213, 0.6) 0%, transparent 40%);
        }
        /* Mobile Frame Styling */
        .phone-frame {
            width: 100%;
            max-width: 410px;
            height: 840px;
            background: #f7f5f0;
            border-radius: 44px;
            box-shadow: 0 25px 60px -15px rgba(120, 105, 100, 0.25), 
                        0 0 0 12px #e8e2dc,
                        0 0 0 14px #d8d0c8;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }
        /* Phone Inner Scrollable Content */
        .phone-screen {
            flex: 1;
            overflow-y: auto;
            scrollbar-width: thin;
            scrollbar-color: #d1c5bc transparent;
        }
        .phone-screen::-webkit-scrollbar {
            width: 4px;
        }
        .phone-screen::-webkit-scrollbar-thumb {
            background-color: #d1c5bc;
            border-radius: 4px;
        }
        .soft-card {
            background: rgba(255, 255, 255, 0.9);
            backdrop-filter: blur(10px);
            border: 1px solid rgba(235, 225, 220, 0.8);
            box-shadow: 0 6px 20px rgba(180, 165, 160, 0.08);
        }
        .soft-card:hover {
            border-color: rgba(205, 190, 185, 0.9);
            box-shadow: 0 10px 25px rgba(180, 165, 160, 0.15);
            transform: translateY(-2px);
        }
        .olive-badge {
            background-color: #dbe4dc;
            color: #4a5c4e;
        }
    </style>
</head>
<body class="min-h-screen flex items-center justify-center p-0 sm:p-6 selection:bg-[#dfc4cb] selection:text-[#4a3f44]">

    <!-- Smartphone Mockup Container -->
    <div class="phone-frame">
        
        <!-- iPhone Dynamic Island / Notch Simulation -->
        <div class="absolute top-0 left-1/2 -translate-x-1/2 w-32 h-6 bg-[#d8d0c8] rounded-b-2xl z-50 flex items-center justify-center">
            <div class="w-3 h-3 bg-[#4a423f] rounded-full mr-3"></div>
            <div class="w-2 h-2 bg-[#5c6b60] rounded-full"></div>
        </div>

        <!-- Phone Inner Content Area -->
        <div class="phone-screen pt-12 pb-8 px-4 flex flex-col justify-between">
            
            <div>
                <!-- Header Section -->
                <header class="w-full pt-4 pb-6 text-center">
                    <div class="inline-flex items-center gap-1.5 px-3.5 py-1.5 rounded-full olive-badge text-[11px] font-semibold tracking-wider mb-3 shadow-sm">
                        <span>🐰 🤍</span> Welcome to Pimmuki store <span class="w-1.5 h-1.5 rounded-full bg-[#8fa893]"></span>
                    </div>
                    <h1 class="text-3xl font-bold tracking-tight text-[#5a4e48] pb-2 font-sans">
                        ✨ Contact 🤍
                    </h1>
                    <p class="text-[#8a7a72] max-w-xs mx-auto text-xs font-light leading-relaxed">
                        - 🤍 🪞 ช่องทางการติดต่อร้านค้า ทักมาพูดคุยสอบถามได้ตลอดเลยนะคะ ยินดีต้อนรับค่ะ 🐇
                    </p>
                </header>

                <!-- Main Content: 2-Column Grid for 6 Buttons -->
                <main class="w-full">
                    <div class="grid grid-cols-2 gap-3">
                        
                        <!-- Line Button -->
                        <a href="https://line.me" target="_blank" rel="noopener noreferrer" 
                           class="soft-card group p-3.5 rounded-2xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-9 h-9 rounded-xl bg-[#dbe4dc] flex items-center justify-center text-[#4a5c4e] text-base group-hover:scale-105 transition-transform">
                                    <i class="fa-brands fa-line"></i>
                                </div>
                                <span class="w-6 h-6 rounded-full bg-[#f0eae6] flex items-center justify-center text-[#7a6a62] group-hover:bg-[#4a5c4e] group-hover:text-white transition-all text-[10px]">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-[#5a4e48] group-hover:text-[#4a5c4e]">Line</h2>
                                <p class="text-[10px] text-[#9a8a82] truncate mt-0.5">@yourbrand</p>
                            </div>
                        </a>

                        <!-- X (Twitter) Button -->
                        <a href="https://twitter.com" target="_blank" rel="noopener noreferrer" 
                           class="soft-card group p-3.5 rounded-2xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-9 h-9 rounded-xl bg-stone-100 flex items-center justify-center text-stone-700 text-sm group-hover:scale-105 transition-transform">
                                    <i class="fa-brands fa-x-twitter"></i>
                                </div>
                                <span class="w-6 h-6 rounded-full bg-[#f0eae6] flex items-center justify-center text-[#7a6a62] group-hover:bg-stone-800 group-hover:text-white transition-all text-[10px]">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-[#5a4e48] group-hover:text-stone-900">X</h2>
                                <p class="text-[10px] text-[#9a8a82] truncate mt-0.5">@yourbrand</p>
                            </div>
                        </a>

                        <!-- Facebook Button -->
                        <a href="https://facebook.com" target="_blank" rel="noopener noreferrer" 
                           class="soft-card group p-3.5 rounded-2xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-9 h-9 rounded-xl bg-blue-50 flex items-center justify-center text-blue-500 text-base group-hover:scale-105 transition-transform">
                                    <i class="fa-brands fa-facebook-f"></i>
                                </div>
                                <span class="w-6 h-6 rounded-full bg-[#f0eae6] flex items-center justify-center text-[#7a6a62] group-hover:bg-blue-500 group-hover:text-white transition-all text-[10px]">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-[#5a4e48] group-hover:text-blue-600">Facebook</h2>
                                <p class="text-[10px] text-[#9a8a82] truncate mt-0.5">Brand Page</p>
                            </div>
                        </a>

                        <!-- Instagram Button -->
                        <a href="https://instagram.com" target="_blank" rel="noopener noreferrer" 
                           class="soft-card group p-3.5 rounded-2xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-9 h-9 rounded-xl bg-purple-50 flex items-center justify-center text-purple-500 text-base group-hover:scale-105 transition-transform">
                                    <i class="fa-brands fa-instagram"></i>
                                </div>
                                <span class="w-6 h-6 rounded-full bg-[#f0eae6] flex items-center justify-center text-[#7a6a62] group-hover:bg-purple-600 group-hover:text-white transition-all text-[10px]">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-[#5a4e48] group-hover:text-purple-600">Instagram</h2>
                                <p class="text-[10px] text-[#9a8a82] truncate mt-0.5">@yourbrand</p>
                            </div>
                        </a>

                        <!-- TikTok Button -->
                        <a href="https://tiktok.com" target="_blank" rel="noopener noreferrer" 
                           class="soft-card group p-3.5 rounded-2xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-9 h-9 rounded-xl bg-pink-50 flex items-center justify-center text-pink-500 text-base group-hover:scale-105 transition-transform">
                                    <i class="fa-brands fa-tiktok"></i>
                                </div>
                                <span class="w-6 h-6 rounded-full bg-[#f0eae6] flex items-center justify-center text-[#7a6a62] group-hover:bg-pink-500 group-hover:text-white transition-all text-[10px]">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-[#5a4e48] group-hover:text-pink-600">Tiktok</h2>
                                <p class="text-[10px] text-[#9a8a82] truncate mt-0.5">@yourbrand</p>
                            </div>
                        </a>

                        <!-- Gmail Button -->
                        <a href="mailto:contact@yourbrand.com" 
                           class="soft-card group p-3.5 rounded-2xl transition-all duration-300 flex flex-col justify-between relative overflow-hidden">
                            <div class="flex items-center justify-between mb-3">
                                <div class="w-9 h-9 rounded-xl bg-red-50 flex items-center justify-center text-red-500 text-base group-hover:scale-105 transition-transform">
                                    <i class="fa-solid fa-envelope"></i>
                                </div>
                                <span class="w-6 h-6 rounded-full bg-[#f0eae6] flex items-center justify-center text-[#7a6a62] group-hover:bg-red-500 group-hover:text-white transition-all text-[10px]">
                                    <i class="fa-solid fa-arrow-right"></i>
                                </span>
                            </div>
                            <div>
                                <h2 class="text-sm font-bold text-[#5a4e48] group-hover:text-red-600">Gmail</h2>
                                <p class="text-[10px] text-[#9a8a82] truncate mt-0.5">Send Mail</p>
                            </div>
                        </a>

                    </div>
                </main>
            </div>

            <!-- Footer Section Inside Phone -->
            <footer class="pt-6 pb-2 text-center text-[10px] text-[#a3938a] border-t border-[#eae2dc] mt-6">
                &copy; 2026 Pimmuki Shop. All rights reserved. 🤍
            </footer>

        </div>

        <!-- iPhone Home Indicator Bar -->
        <div class="absolute bottom-1 left-1/2 -translate-x-1/2 w-32 h-1 bg-[#b8aba0] rounded-full z-50"></div>

    </div>

</body>
</html>
